[project]
name = "rxauth-ai"
version = "0.1.0"
description = "Evidence-grounded prior-authorization intelligence prototype"
readme = "README.md"
authors = [
    { name = "Bavely S. Tawfik", email = "bavlesamy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "scikit-learn>=1.4",
]

[project.scripts]
rxauth-build-dataset = "rxauth_ai.build_dataset:main"
rxauth-milestone0 = "rxauth_ai.cli:main"
rxauth-train-classifier = "rxauth_ai.train_classifier:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rxauth_ai"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
