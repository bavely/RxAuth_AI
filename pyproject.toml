[project]
name = "rxauth-ai"
version = "0.1.0"
description = "Evidence-grounded prior-authorization intelligence prototype"
readme = "README.md"
authors = [
    { name = "Bavely S. Tawfik", email = "bavlesamy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pydantic>=2.0",
    "pypdf>=5.0",
    "reportlab>=4.2",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
deep = [
    "torch>=2.5",
    "transformers>=4.48,<6",
]
ocr = ["pytesseract>=0.3.13"]

[project.scripts]
rxauth-build-dataset = "rxauth_ai.build_dataset:main"
rxauth-benchmark-ingestion = "rxauth_ai.benchmark_ingestion:main"
rxauth-benchmark-extraction = "rxauth_ai.benchmark_extraction:main"
rxauth-extract = "rxauth_ai.extraction:main"
rxauth-ingest = "rxauth_ai.ingestion:main"
rxauth-milestone0 = "rxauth_ai.cli:main"
rxauth-train-classifier = "rxauth_ai.train_classifier:main"
rxauth-train-deep-classifier = "rxauth_ai.train_deep_classifier:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rxauth_ai"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
